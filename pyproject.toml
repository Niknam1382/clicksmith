[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clicksmith"
version = "1.0.1"
description = "Auto clicker, macro recorder, Unicode typing and scheduler in one open-source tool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Clicksmith contributors" }]
keywords = [
    "auto-clicker", "autoclicker", "macro-recorder", "automation",
    "mouse-automation", "keyboard-automation", "pyside6", "windows",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.11.2,<7",
    "pynput>=1.8.2,<2",
]

[project.urls]
Homepage = "https://github.com/OWNER/clicksmith"
Repository = "https://github.com/OWNER/clicksmith"
Issues = "https://github.com/OWNER/clicksmith/issues"
Changelog = "https://github.com/OWNER/clicksmith/blob/main/CHANGELOG.md"

[project.scripts]
clicksmith = "clicksmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clicksmith.assets" = ["*.png", "*.ico"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Belt-and-suspenders alongside `pip install -e .` in requirements-dev.txt: this makes `src/`
# importable even if an editable install is ever skipped, so tests never fail with a bare
# "No module named 'clicksmith'" collection error.
pythonpath = ["src"]

[tool.coverage.run]
source = ["clicksmith"]
omit = ["*/ui/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Pyflakes only for now: real-bug detection (undefined names, unused imports/variables,
# redefinitions) with no formatting opinions. This code has never been run through `ruff
# format`, so style/formatting rule sets (E/W pycodestyle, UP, B, SIM, C4, RUF, S, I) are
# deliberately left off until someone runs `ruff format .` once to bring the tree in line -
# turning them on before that would fail on formatting noise, not real problems. See
# CONTRIBUTING.md.
select = ["F"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["clicksmith.core"]

[[tool.mypy.overrides]]
module = ["pynput.*"]
ignore_missing_imports = true
