[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clicksmith"
version = "1.0.0"
description = "Auto clicker, macro recorder, Unicode typing and scheduler in one open-source tool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Clicksmith contributors" }]
keywords = [
    "auto-clicker", "autoclicker", "macro-recorder", "automation",
    "mouse-automation", "keyboard-automation", "pyside6", "windows",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.11.2,<7",
    "pynput>=1.8.2,<2",
]

[project.urls]
Homepage = "https://github.com/OWNER/clicksmith"
Repository = "https://github.com/OWNER/clicksmith"
Issues = "https://github.com/OWNER/clicksmith/issues"
Changelog = "https://github.com/OWNER/clicksmith/blob/main/CHANGELOG.md"

[project.scripts]
clicksmith = "clicksmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clicksmith.assets" = ["*.png", "*.ico"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.coverage.run]
source = ["clicksmith"]
omit = ["*/ui/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
    "S",             # bandit-lite security checks
]
ignore = [
    "S311",  # `random` is used for click jitter, not cryptography
    "S603", "S607",  # sysutils shells out to trusted, hardcoded OS commands
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]        # assert / hardcoded test data is expected in tests
"src/clicksmith/core/input/win32.py" = ["N801", "N815"]  # Win32 struct field names are fixed by the ABI

[tool.ruff.lint.isort]
known-first-party = ["clicksmith"]

[tool.mypy]
python_version = "3.11"
packages = ["clicksmith.core"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pynput.*"]
ignore_missing_imports = true
