name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Macro tab
        2. Add a "Type text" step with ...
        3. Press Start
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clicksmith version
      description: Help → About Clicksmith
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Clicksmith?
      options:
        - Setup installer (.exe)
        - Portable build (.zip)
        - Ran from source (pip / git clone)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Help → Open log file. No need to paste the whole file, just the lines around the problem.
      render: text
