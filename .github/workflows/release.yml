name: Release

# Pushing a tag like v1.2.3 builds Clicksmith.exe and a Setup installer on a Windows runner
# and publishes both, plus a SHA-256 checksum file, to a GitHub Release for that tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -q

      - name: Determine the version
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the package version
        shell: bash
        run: |
          pkg_version=$(python -c "import sys; sys.path.insert(0, 'src'); from clicksmith import __version__; print(__version__)")
          if [ "$pkg_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match clicksmith.__version__ ($pkg_version)"
            exit 1
          fi

      - name: Generate the Windows version-info resource
        run: python packaging\pyinstaller\generate_version_info.py

      - name: Build with PyInstaller
        run: >
          pyinstaller packaging\pyinstaller\clicksmith.spec --noconfirm
          --distpath packaging\pyinstaller\dist --workpath packaging\pyinstaller\build

      - name: Run the frozen self-test
        run: .\packaging\pyinstaller\dist\Clicksmith\Clicksmith.exe --selftest

      - name: Zip the portable build
        shell: pwsh
        run: |
          $zip = "Clicksmith-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "packaging\pyinstaller\dist\Clicksmith\*" -DestinationPath $zip
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "packaging\inno\clicksmith.iss"
          $installer = Get-ChildItem "packaging\inno\Output\*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName ".\$($installer.Name)"
          echo "INSTALLER_PATH=$($installer.Name)" >> $env:GITHUB_ENV

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash $env:ZIP_PATH, $env:INSTALLER_PATH -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Clicksmith ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            | File | What it is |
            | --- | --- |
            | `Clicksmith-Setup-${{ steps.version.outputs.version }}.exe` | Installer (Start Menu shortcut, uninstaller) - **recommended** |
            | `Clicksmith-${{ steps.version.outputs.version }}-windows-x64.zip` | Portable build - unzip and run `Clicksmith.exe`, nothing installed |

            Verify a download with `SHA256SUMS.txt` (e.g. `certutil -hashfile Clicksmith-Setup-${{ steps.version.outputs.version }}.exe SHA256` on Windows).
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.INSTALLER_PATH }}
            SHA256SUMS.txt
